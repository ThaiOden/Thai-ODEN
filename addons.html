<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Confirm Oden Order</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 font-sans">
  <div class="max-w-3xl mx-auto p-6">
    <h1 class="text-3xl font-bold text-orange-700 mb-6 text-center">Confirm Your Oden Order</h1>
    <div id="order-summary" class="bg-white p-4 rounded shadow mb-6"></div>

    <div class="text-center">
      <button onclick="sendWhatsAppOrder()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded shadow">
        Submit Order via WhatsApp
      </button>
    </div>
  </div>

  <script>
    const orderData = JSON.parse(localStorage.getItem('odenOrder'));
    const foodItems = [
      'Instant Noodle', 'Fish Cake', 'Fuchuk', 'Crab Stick', 'Fish Ball',
      'Seafood Tofu', 'Enoki Mushroom', 'Cheese Tofu', 'Egg', 'White Radish'
    ];
    const drinkItems = ['Sprite', 'Coca-Cola', 'F&N Soda', 'A&W', 'Pepsi'];

    function renderOrderSummary() {
      if (!orderData) {
        document.getElementById("order-summary").innerHTML = "<p class='text-red-600'>No order found.</p>";
        return;
      }

      let summaryHTML = `<h2 class="text-xl font-semibold mb-2">Selected Set: Set ${orderData.set} (RM${orderData.setPrice})</h2>`;

      const items = orderData.items;
      const foodList = foodItems.filter(name => items[name] > 0);
      const drinkList = drinkItems.filter(name => items[name] > 0);

      if (foodList.length) {
        summaryHTML += `<h3 class="text-lg font-semibold mt-4">Extra Food Items:</h3><ul class="list-disc list-inside">`;
        foodList.forEach(name => {
          summaryHTML += `<li>${name} x${items[name]}</li>`;
        });
        summaryHTML += `</ul>`;
      }

      if (drinkList.length) {
        summaryHTML += `<h3 class="text-lg font-semibold mt-4">Drinks:</h3><ul class="list-disc list-inside">`;
        drinkList.forEach(name => {
          summaryHTML += `<li>${name} x${items[name]}</li>`;
        });
        summaryHTML += `</ul>`;
      }

      const total = calculateTotal();
      summaryHTML += `<div class="text-xl font-bold mt-4">Total: RM${total.toFixed(2)}</div>`;

      document.getElementById("order-summary").innerHTML = summaryHTML;
    }

    function calculateTotal() {
      let total = orderData.setPrice;
      const prices = {
        'Instant Noodle': 1, 'Fish Cake': 1, 'Fuchuk': 1, 'Crab Stick': 1,
        'Fish Ball': 2, 'Seafood Tofu': 2, 'Enoki Mushroom': 1, 'Cheese Tofu': 2,
        'Egg': 1, 'White Radish': 2,
        'Sprite': 2.5, 'Coca-Cola': 2.5, 'F&N Soda': 2.5, 'A&W': 2.5, 'Pepsi': 2.5
      };

      for (let name in orderData.items) {
        total += prices[name] * orderData.items[name];
      }
      return total;
    }

    function sendWhatsAppOrder() {
      const phone = "601115701783";
      let message = `Oden Order:%0ASet: ${orderData.set} (RM${orderData.setPrice})`;

      for (let name in orderData.items) {
        if (orderData.items[name] > 0) {
          message += `%0A${name}: ${orderData.items[name]}`;
        }
      }

      message += `%0ATotal: RM${calculateTotal().toFixed(2)}`;
      const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
      window.open(url, "_blank");
    }

    renderOrderSummary();
  </script>
</body>
</html>
