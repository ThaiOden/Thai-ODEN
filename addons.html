<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oden Ordering</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-orange-50 font-sans">
  <div class="max-w-5xl mx-auto p-6">
    <h1 class="text-3xl font-bold text-center text-orange-700 mb-6">Oden Set Selection</h1>

    <!-- Set Selection -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
      <button onclick="selectSet('A', 6, this)" class="set-button bg-white p-4 rounded shadow hover:bg-orange-100">Set A (RM6)</button>
      <button onclick="selectSet('B', 6, this)" class="set-button bg-white p-4 rounded shadow hover:bg-orange-100">Set B (RM6)</button>
      <button onclick="selectSet('C', 8, this)" class="set-button bg-white p-4 rounded shadow hover:bg-orange-100">Set C (RM8)</button>
      <button onclick="selectSet('D', 8, this)" class="set-button bg-white p-4 rounded shadow hover:bg-orange-100">Set D (RM8)</button>
      <button onclick="selectSet('E', 10, this)" class="set-button bg-white p-4 rounded shadow hover:bg-orange-100">Set E (RM10)</button>
      <button onclick="selectSet('F', 10, this)" class="set-button bg-white p-4 rounded shadow hover:bg-orange-100">Set F (RM10)</button>
      <button onclick="selectSet('Premium', 15, this)" class="set-button bg-white p-4 rounded shadow hover:bg-orange-100">Premium Set (RM15)</button>
    </div>
    <div class="mb-6">
      <button onclick="clearSetSelection()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded">Clear Set Selection</button>
    </div>
    <script>

      let selectedSet = null;
      let selectedSetPrice = 0;
      let activeButton = null;
      let additionalItems = {};

      const foodItems = [
        { name: 'Instant Noodle', price: 1 },
        { name: 'Fish Cake', price: 1 },
        { name: 'Fuchuk', price: 1 },
        { name: 'Crab Stick', price: 1 },
        { name: 'Fish Ball', price: 2 },
        { name: 'Seafood Tofu', price: 2 },
        { name: 'Enoki Mushroom', price: 1 },
        { name: 'Cheese Tofu', price: 2 },
        { name: 'Egg', price: 1 },
        { name: 'White Radish', price: 2 },
      ];

      const drinkItems = [
        { name: 'Sprite', price: 3 },
        { name: 'Coca-Cola', price: 3 },
        { name: 'F&N Soda', price: 3 },
        { name: 'A&W', price: 3 },
        { name: 'Pepsi', price: 3 },
      ];

      function createItemControls(containerId, items) {
        const container = document.getElementById(containerId);
        items.forEach(item => {
          const wrapper = document.createElement('div');
          wrapper.className = 'flex justify-between items-center bg-white p-2 rounded shadow';

          const name = document.createElement('span');
          name.textContent = item.name === 'White Radish'
            ? `${item.name} (RM${item.price} for 2 pcs)`
            : `${item.name} (RM${item.price})`;

          const controls = document.createElement('div');
          controls.className = 'flex items-center space-x-2';

          const minus = document.createElement('button');
          minus.textContent = '-';
          minus.className = 'bg-orange-400 text-white w-6 h-6 rounded';
          const plus = document.createElement('button');
          plus.textContent = '+';
          plus.className = 'bg-orange-500 text-white w-6 h-6 rounded';

          const count = document.createElement('span');
          count.textContent = '0';

          additionalItems[item.name] = 0;

          minus.onclick = () => {
            if (additionalItems[item.name] > 0) {
              additionalItems[item.name]--;
              count.textContent = additionalItems[item.name];
              updateTotalPrice();
            }
          };
          plus.onclick = () => {
            additionalItems[item.name]++;
            count.textContent = additionalItems[item.name];
            updateTotalPrice();
          };

          controls.appendChild(minus);
          controls.appendChild(count);
          controls.appendChild(plus);

          wrapper.appendChild(name);
          wrapper.appendChild(controls);

          container.appendChild(wrapper);
        });
      }

      function selectSet(setName, price, button) {
        selectedSet = setName;
        selectedSetPrice = price;
        updateTotalPrice();

        if (activeButton) {
          activeButton.classList.remove('bg-orange-200');
        }
        button.classList.add('bg-orange-200');
        activeButton = button;
      }

      function clearSetSelection() {
        selectedSet = null;
        selectedSetPrice = 0;
        if (activeButton) {
          activeButton.classList.remove('bg-orange-200');
          activeButton = null;
        }
        updateTotalPrice();
      }

      function updateTotalPrice() {
        let total = selectedSetPrice;
        for (let item in additionalItems) {
          const price = foodItems.concat(drinkItems).find(i => i.name === item).price;
          total += price * additionalItems[item];
        }
        document.getElementById("totalPrice").textContent = total.toFixed(2);
      }

      function saveSelections() {
        const order = {
          set: selectedSet,
          setPrice: selectedSetPrice,
          items: additionalItems,
        };
        localStorage.setItem('odenOrder', JSON.stringify(order));
      }

      createItemControls('food-items', foodItems);
      createItemControls('drink-items', drinkItems);
    </script>

    <div class="mb-6">
      <label for="customerName" class="block text-lg font-semibold text-orange-700 mb-2">Your Name</label>
      <input type="text" id="customerName" placeholder="Enter your name"
        class="w-full p-3 rounded border border-orange-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-400" />
    </div>

    <div class="text-right text-xl font-bold text-orange-700 mb-6">
      Total Price: RM<span id="totalPrice">0.00</span>
    </div>

    <div class="text-right mt-6">
      <button onclick="submitOrder()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded shadow">
        Submit via WhatsApp
      </button>
    </div>

    <div class="text-right mt-4">
      <button onclick="clearAllSelections()" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-6 rounded shadow">
        Clear All Selections
      </button>
    </div>

    <script>
      function submitOrder() {
        const customerName = document.getElementById('customerName').value.trim();
        if (!customerName) {
          alert('Please enter your name.');
          return;
        }

        const order = JSON.parse(localStorage.getItem('odenOrder'));
        if (!order) {
          alert('No order found.');
          return;
        }

        const now = new Date();
        const date = now.toLocaleDateString('en-MY');
        const time = now.toLocaleTimeString('en-MY', { hour: '2-digit', minute: '2-digit', hour12: true });

        let message = `🧡 *Oden Order* 🧡%0A`;
        message += `👤 *Name:* ${customerName}%0A`;
        message += `🍢 *Set:* ${order.set} (RM${order.setPrice})%0A`;

        const items = Object.entries(order.items).filter(([_, qty]) => qty > 0);
        if (items.length) {
          message += `%0A--- *Items* ---`;
          for (const [item, qty] of items) {
            message += `%0A• ${item} x${qty}`;
          }
        }

        const total = items.reduce((sum, [item, qty]) => {
          const prices = {
            'Instant Noodle': 1, 'Fish Cake': 1, 'Fuchuk': 1, 'Crab Stick': 1,
            'Fish Ball': 2, 'Seafood Tofu': 2, 'Enoki Mushroom': 1, 'Cheese Tofu': 2,
            'Egg': 1, 'White Radish': 2,
            'Sprite': 2.5, 'Coca-Cola': 2.5, 'F&N Soda': 2.5, 'A&W': 2.5, 'Pepsi': 2.5
          };
          return sum + (prices[item] || 0) * qty;
        }, order.setPrice);

        message += `%0A%0A💰 *Total:* RM${total.toFixed(2)}`;
        message += `%0A🕒 *Order Time:* ${date}, ${time}`;

        const phone = "601115701783";
        const url = `https://wa.me/${phone}?text=${message}`;
        window.open(url, '_blank');
      }

      function clearAllSelections() {
        clearSetSelection();
        for (let item in additionalItems) {
          additionalItems[item] = 0;
        }
        const counters = document.querySelectorAll('#food-items span, #drink-items span');
        counters.forEach(span => {
          if (!isNaN(span.textContent)) {
            span.textContent = '0';
          }
        });
        updateTotalPrice();
      }
    </script>
  </div>
</body>

</html>
