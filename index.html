<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oden Ordering</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-orange-50 font-sans">
  <div class="max-w-5xl mx-auto p-6">
    <h1 class="text-3xl font-bold text-center text-orange-700 mb-6">Oden Set Selection</h1>

    <!-- Set Selection -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <button onclick="selectSet('A', 6)" class="bg-white p-4 rounded shadow hover:bg-orange-100">Set A (RM6)</button>
      <button onclick="selectSet('B', 6)" class="bg-white p-4 rounded shadow hover:bg-orange-100">Set B (RM6)</button>
      <button onclick="selectSet('C', 8)" class="bg-white p-4 rounded shadow hover:bg-orange-100">Set C (RM8)</button>
      <button onclick="selectSet('D', 8)" class="bg-white p-4 rounded shadow hover:bg-orange-100">Set D (RM8)</button>
      <button onclick="selectSet('E', 10)" class="bg-white p-4 rounded shadow hover:bg-orange-100">Set E (RM10)</button>
      <button onclick="selectSet('F', 10)" class="bg-white p-4 rounded shadow hover:bg-orange-100">Set F (RM10)</button>
      <button onclick="selectSet('Premium', 15)" class="bg-white p-4 rounded shadow hover:bg-orange-100">Premium Set (RM15)</button>
    </div>

    <!-- Set Contents Table -->
    <div class="overflow-x-auto mb-8">
      <h2 class="text-2xl font-bold text-orange-700 mb-4">What's Included in Each Set</h2>
      <table class="min-w-full text-sm text-center border border-orange-300 bg-white rounded shadow">
        <thead class="bg-orange-100 text-orange-800">
          <tr>
            <th class="p-2 border">Set</th>
            <th class="p-2 border">Instant Noodle</th>
            <th class="p-2 border">Fish Cake</th>
            <th class="p-2 border">Fuchuk</th>
            <th class="p-2 border">Crab Stick</th>
            <th class="p-2 border">Fish Ball</th>
            <th class="p-2 border">Seafood Tofu</th>
            <th class="p-2 border">Enoki Mushroom</th>
            <th class="p-2 border">Cheese Tofu</th>
            <th class="p-2 border">Egg</th>
            <th class="p-2 border">White Radish</th>
            <th class="p-2 border">Price (RM)</th>
          </tr>
        </thead>
        <tbody>
          <tr><td class="border p-1">A</td><td>✓</td><td>✓</td><td></td><td>✓</td><td></td><td></td><td></td><td></td><td>✓</td><td></td><td>6</td></tr>
          <tr><td class="border p-1">B</td><td></td><td>✓</td><td>✓</td><td></td><td></td><td></td><td></td><td></td><td>✓</td><td>✓</td><td>6</td></tr>
          <tr><td class="border p-1">C</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td></td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>8</td></tr>
          <tr><td class="border p-1">D</td><td></td><td></td><td>✓</td><td></td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>8</td></tr>
          <tr><td class="border p-1">E</td><td>✓</td><td>✓</td><td></td><td></td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>10</td></tr>
          <tr><td class="border p-1">F</td><td></td><td></td><td></td><td>✓</td><td>✓</td><td></td><td></td><td>✓</td><td>✓</td><td>✓</td><td>10</td></tr>
          <tr><td class="border p-1">Premium</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>15</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Total Price Display -->
    <div class="text-right text-xl font-bold text-orange-700 mb-6">
      Total Price: RM<span id="totalPrice">0.00</span>
    </div>

    <!-- JavaScript for Price Calculator -->
    <script>
      let selectedSetPrice = 0;

      function selectSet(setName, price) {
        selectedSetPrice = price;
        updateTotalPrice();
      }

      function updateTotalPrice() {
        document.getElementById("totalPrice").textContent = selectedSetPrice.toFixed(2);
      }
    </script>
  </div>
</body>

</html>
