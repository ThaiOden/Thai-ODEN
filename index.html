<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Oden Order</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-800 p-6">
  <div class="max-w-3xl mx-auto">
    <h1 class="text-3xl font-bold text-orange-700 mb-4">Oden Ordering</h1>

    <label for="name" class="block mb-1 font-semibold">Your Name <span class="text-red-500">*</span></label>
    <input id="name" type="text" class="w-full mb-4 border border-gray-300 rounded p-2" placeholder="Enter your name" required>

    <!-- Set Selection -->
    <h2 class="text-xl font-semibold text-orange-700 mb-2">Choose a Set (Optional)</h2>
    <div class="grid grid-cols-4 gap-2 mb-4">
      <button onclick="selectSet('A', 6, this)" class="bg-orange-100 hover:bg-orange-200 px-4 py-2 rounded">Set A (RM6)</button>
      <button onclick="selectSet('B', 6, this)" class="bg-orange-100 hover:bg-orange-200 px-4 py-2 rounded">Set B (RM6)</button>
      <button onclick="selectSet('C', 8, this)" class="bg-orange-100 hover:bg-orange-200 px-4 py-2 rounded">Set C (RM8)</button>
      <button onclick="selectSet('D', 8, this)" class="bg-orange-100 hover:bg-orange-200 px-4 py-2 rounded">Set D (RM8)</button>
      <button onclick="selectSet('E', 10, this)" class="bg-orange-100 hover:bg-orange-200 px-4 py-2 rounded">Set E (RM10)</button>
      <button onclick="selectSet('F', 10, this)" class="bg-orange-100 hover:bg-orange-200 px-4 py-2 rounded">Set F (RM10)</button>
      <button onclick="selectSet('Premium', 15, this)" class="bg-orange-100 hover:bg-orange-200 px-4 py-2 rounded col-span-2">Premium Set (RM15)</button>
    </div>

    <div id="set-description" class="mt-4 text-md text-orange-700 mb-4"></div>

    <!-- Food Selection -->
    <h2 class="text-xl font-semibold text-orange-700 mb-2">Select Additional Food Items (RM2 Each, White Radish = 2 pieces)</h2>
    <div id="foodItems" class="grid grid-cols-2 gap-2 mb-4"></div>

    <!-- Drink Selection -->
    <h2 class="text-xl font-semibold text-orange-700 mb-2">Select Drinks (RM3 Each)</h2>
    <div id="drinkItems" class="grid grid-cols-2 gap-2 mb-4"></div>

    <div class="text-lg font-semibold text-orange-700 mb-4">Total: RM <span id="total">0</span></div>

    <button onclick="submitOrder()" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded">Submit via WhatsApp</button>
  </div>

  <script>
    let selectedSet = null;
    let selectedSetPrice = 0;
    let activeButton = null;
    const foodItems = [
      'Cheese tofu',
      'Fish ball',
      'Fish cake',
      'Seafood tofu',
      'Fuchuk',
      'Crab stick',
      'Instant noodle',
      'Enoki mushroom',
      'Egg',
      'White radish'
    ];
    const drinkItems = ['Sprite', 'Coca-Cola', 'F&N Soda', 'A&W', 'Pepsi'];
    const foodCounts = {};
    const drinkCounts = {};

    function createItemElements(items, containerId, countsObj, pricePerItem) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      items.forEach(item => {
        countsObj[item] = 0;
        const itemEl = document.createElement("div");
        itemEl.className = "flex justify-between items-center border border-gray-300 rounded px-3 py-2";

        const label = document.createElement("span");
        label.textContent = item;

        const controls = document.createElement("div");
        controls.className = "flex items-center gap-2";

        const minusBtn = document.createElement("button");
        minusBtn.textContent = "-";
        minusBtn.className = "bg-red-500 text-white w-6 h-6 rounded";
        minusBtn.onclick = () => {
          if (countsObj[item] > 0) {
            countsObj[item]--;
            countEl.textContent = countsObj[item];
            updateTotalPrice();
          }
        };

        const countEl = document.createElement("span");
        countEl.textContent = "0";

        const plusBtn = document.createElement("button");
        plusBtn.textContent = "+";
        plusBtn.className = "bg-green-500 text-white w-6 h-6 rounded";
        plusBtn.onclick = () => {
          countsObj[item]++;
          countEl.textContent = countsObj[item];
          updateTotalPrice();
        };

        controls.append(minusBtn, countEl, plusBtn);
        itemEl.append(label, controls);
        container.appendChild(itemEl);
      });
    }

    function updateTotalPrice() {
      let foodTotal = 0;
      for (const [item, count] of Object.entries(foodCounts)) {
        const multiplier = item === 'White radish' ? 2 : 1;
        foodTotal += count * multiplier * 2;
      }
      let drinkTotal = 0;
      for (const count of Object.values(drinkCounts)) {
        drinkTotal += count * 3;
      }
      const total = selectedSetPrice + foodTotal + drinkTotal;
      document.getElementById("total").textContent = total;
    }

    function selectSet(setName, price, button) {
      selectedSet = setName;
      selectedSetPrice = price;
      updateTotalPrice();

      if (activeButton) {
        activeButton.classList.remove('bg-orange-200');
      }
      button.classList.add('bg-orange-200');
      activeButton = button;

      const setDescriptions = {
        A: ['Instant noodle', 'Fish cake', 'Crab stick', 'Egg'],
        B: ['Instant noodle', 'Fish cake', 'Fuchuk', 'White radish', 'Egg'],
        C: ['Fish cake', 'Fuchuk', 'Fish ball', 'White radish', 'Egg'],
        D: ['Fuchuk', 'Fish ball', 'Enoki mushroom', 'Cheese tofu', 'Egg'],
        E: ['Instant noodle', 'Fish ball', 'Seafood tofu', 'Enoki mushroom', 'Cheese tofu', 'Egg', 'White radish'],
        F: ['Fish cake', 'Fuchuk', 'Seafood tofu', 'Enoki mushroom', 'Cheese tofu', 'Egg', 'White radish'],
        Premium: ['Instant noodle', 'Fish cake', 'Fuchuk', 'Crab stick', 'Fish ball', 'Seafood tofu', 'Enoki mushroom', 'Cheese tofu', 'Egg', 'White radish']
      };

      const descriptionContainer = document.getElementById("set-description");
      const items = setDescriptions[setName] || [];
      descriptionContainer.innerHTML = `<p><strong>${setName} Set includes:</strong><br>✅ ${items.join('<br>✅ ')}</p>`;
    }

    function submitOrder() {
      const name = document.getElementById("name").value.trim();
      if (!name) {
        alert("Please enter your name.");
        return;
      }

      let message = `Oden Order from ${name}\n`;

      if (selectedSet) {
        message += `Set: ${selectedSet} (RM${selectedSetPrice})\n`;
      }

      const foodList = Object.entries(foodCounts)
        .filter(([_, count]) => count > 0)
        .map(([item, count]) => `${item} x${count}`)
        .join(", ");
      if (foodList) message += `Food: ${foodList}\n`;

      const drinkList = Object.entries(drinkCounts)
        .filter(([_, count]) => count > 0)
        .map(([item, count]) => `${item} x${count}`)
        .join(", ");
      if (drinkList) message += `Drinks: ${drinkList}\n`;

      const total = document.getElementById("total").textContent;
      message += `Total: RM${total}`;

      const encodedMessage = encodeURIComponent(message);
      const whatsappUrl = `https://wa.me/601115701783?text=${encodedMessage}`;
      window.open(whatsappUrl, '_blank');
    }

    createItemElements(foodItems, "foodItems", foodCounts, 2);
    createItemElements(drinkItems, "drinkItems", drinkCounts, 3);
  </script>
</body>
</html>
