<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Oden - Starting From RM6</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background: #fff6e6;
      color: #333;
    }
    header {
      text-align: center;
      padding: 2rem 1rem;
      background: #ffe6cc;
    }
    header img {
      max-width: 200px;
    }
    h1 {
      margin-top: 1rem;
      font-size: 2.2rem;
    }
    .price {
      font-size: 1.5rem;
      color: #d32f2f;
      font-weight: bold;
    }
    .menu, .sets, .about, .contact {
      padding: 2rem 1rem;
      text-align: center;
    }
    .items, .sets-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }
    .item, .set {
      background: #fff;
      border-radius: 12px;
      padding: 1rem;
      width: 180px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .item img, .set img {
      width: 100%;
      border-radius: 10px;
    }
    .item label {
      display: block;
      margin: 0.5rem 0 0.2rem;
      font-weight: bold;
    }
    .quantity-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }
    .quantity-controls button {
      background: #d32f2f;
      color: white;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .order-btn {
      margin-top: 2rem;
      background: #d32f2f;
      color: white;
      padding: 1rem 2rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    footer {
      background: #d32f2f;
      color: white;
      text-align: center;
      padding: 1rem;
    }
    .total-price {
      font-weight: bold;
      font-size: 1.2rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

<header>
  <img src="logo.jpg" alt="Oden Logo" />
  <h1>Delicious Oden Bowls</h1>
  <p class="price">Starting from RM6</p>
  <p><a href="https://www.instagram.com/thai_oden/" target="_blank">Follow us: <strong>THAI_ODEN</strong></a></p>
</header>

<section class="sets">
  <h2>Oden Sets</h2>
  <div class="sets-container">
    <div class="set" onclick="selectSet(['Fish Ball','Seafood Tofu','Cheese Tofu'], [1,1,1])">
      <img src="set1.jpg" alt="Set A" />
      <h3>Set A</h3>
      <p>Fish Ball, Seafood Tofu, Cheese Tofu</p>
      <p><strong>RM6</strong></p>
    </div>
    <div class="set" onclick="selectSet(['Instant Noodle','Fish Cake','Egg','Fuchuk'], [1,1,1,1])">
      <img src="set2.jpg" alt="Set B" />
      <h3>Set B</h3>
      <p>Instant Noodle, Fish Cake, Egg, Fuchuk</p>
      <p><strong>RM5</strong></p>
    </div>
    <!-- Add more sets as needed -->
  </div>
</section>

<section class="menu">
  <h2>Build Your Bowl</h2>
  <form id="orderForm">
    <div class="items">
      <!-- Example item -->
      <div class="item">
        <img src="fishball.jpg" alt="Fish Ball" />
        <label>Fish Ball (RM2)</label>
        <div class="quantity-controls">
          <button type="button" onclick="adjustQty('Fish Ball', -1)">-</button>
          <input type="number" id="Fish Ball" name="Fish Ball" value="0" readonly>
          <button type="button" onclick="adjustQty('Fish Ball', 1)">+</button>
        </div>
      </div>

      <!-- Repeat for other items -->
      <div class="item">
        <img src="seafoodtofu.jpg" alt="Seafood Tofu" />
        <label>Seafood Tofu (RM2)</label>
        <div class="quantity-controls">
          <button type="button" onclick="adjustQty('Seafood Tofu', -1)">-</button>
          <input type="number" id="Seafood Tofu" name="Seafood Tofu" value="0" readonly>
          <button type="button" onclick="adjustQty('Seafood Tofu', 1)">+</button>
        </div>
      </div>
      <div class="item">
        <img src="cheesetofu.jpg" alt="Cheese Tofu" />
        <label>Cheese Tofu (RM2)</label>
        <div class="quantity-controls">
          <button type="button" onclick="adjustQty('Cheese Tofu', -1)">-</button>
          <input type="number" id="Cheese Tofu" name="Cheese Tofu" value="0" readonly>
          <button type="button" onclick="adjustQty('Cheese Tofu', 1)">+</button>
        </div>
      </div>

      <!-- RM1 items -->
      <div class="item">
        <img src="egg.jpg" alt="Egg" />
        <label>Egg (RM1)</label>
        <div class="quantity-controls">
          <button type="button" onclick="adjustQty('Egg', -1)">-</button>
          <input type="number" id="Egg" name="Egg" value="0" readonly>
          <button type="button" onclick="adjustQty('Egg', 1)">+</button>
        </div>
      </div>
      <!-- Repeat for other RM1 items -->
    </div>

    <p class="total-price">Total: RM <span id="totalPrice">0.00</span></p>

    <div style="text-align:center;">
      <button type="button" class="order-btn" onclick="submitOrder()">Order via WhatsApp</button>
    </div>
  </form>
</section>

<footer>
  &copy; 2025 Oden. All rights reserved.
</footer>

<script>
  const prices = {
    "Fish Ball": 2,
    "Seafood Tofu": 2,
    "Cheese Tofu": 2,
    "Instant Noodle": 1,
    "Fish Cake": 1,
    "Crab Stick": 1,
    "Egg": 1,
    "White Radish": 1,
    "Enoki Mushroom": 1,
    "Fuchuk": 1
  };

  function adjustQty(item, delta) {
    const input = document.getElementById(item);
    let value = parseInt(input.value);
    value = Math.max(0, value + delta);
    input.value = value;
    calculateTotal();
  }

  function calculateTotal() {
    let total = 0;
    for (const item in prices) {
      const qty = parseInt(document.getElementById(item)?.value || 0);
      total += qty * prices[item];
    }
    document.getElementById('totalPrice').textContent = total.toFixed(2);
  }

  function selectSet(items, quantities) {
    items.forEach((item, i) => {
      const input = document.getElementById(item);
      if (input) {
        input.value = quantities[i];
      }
    });
    calculateTotal();
  }

  function submitOrder() {
    const inputs = document.querySelectorAll('input[type="number"]');
    let message = 'Hi, I would like to order:\n';
    let hasItems = false;

    inputs.forEach(input => {
      const qty = parseInt(input.value);
      if (qty > 0) {
        message += `- ${input.name}: ${qty}\n`;
        hasItems = true;
      }
    });

    if (!hasItems) {
      alert('Please select at least one item.');
      return;
    }

    const total = document.getElementById('totalPrice').textContent;
    message += `Total Price: RM ${total}`;
    const encodedMessage = encodeURIComponent(message);
    const phoneNumber = '601115701783';
    const url = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;
    window.open(url, '_blank');
  }
</script>

</body>
</html>
