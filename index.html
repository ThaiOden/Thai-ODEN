<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Oden</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #fff6e6;
      margin: 0;
      padding: 0;
    }
    header {
      background: #ffe6cc;
      padding: 1rem;
      text-align: center;
    }
    header h1 {
      margin: 0.5rem 0;
    }
    .sets {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      padding: 2rem 1rem;
    }
    .set {
      background: #fff;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 180px;
      text-align: center;
      cursor: pointer;
    }
    .set h3 {
      margin: 0.5rem 0;
    }
    .quantity {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 0.5rem;
    }
    .quantity button {
      width: 30px;
      height: 30px;
      font-size: 18px;
      margin: 0 5px;
      cursor: pointer;
    }
    .drinks {
      padding: 2rem 1rem;
      text-align: center;
    }
    .drinks h2 {
      margin-bottom: 1rem;
    }
    .drink-item {
      margin-bottom: 0.5rem;
    }
    .drink-item span {
      margin-right: 10px;
    }
    .btn-next {
      display: block;
      margin: 2rem auto;
      padding: 0.8rem 2rem;
      background: #d32f2f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>THAI_ODEN</h1>
    <p>Select your Oden Set</p>
  </header>

  <div class="sets">
    <div class="set" onclick="changeQty('Set A', 1)"><h3>Set A</h3><p>RM6</p><div class="quantity"><button onclick="changeQty('Set A', -1, event)">−</button><span id="qty-Set A">0</span><button onclick="changeQty('Set A', 1, event)">+</button></div></div>
    <div class="set" onclick="changeQty('Set B', 1)"><h3>Set B</h3><p>RM6</p><div class="quantity"><button onclick="changeQty('Set B', -1, event)">−</button><span id="qty-Set B">0</span><button onclick="changeQty('Set B', 1, event)">+</button></div></div>
    <div class="set" onclick="changeQty('Set C', 1)"><h3>Set C</h3><p>RM8</p><div class="quantity"><button onclick="changeQty('Set C', -1, event)">−</button><span id="qty-Set C">0</span><button onclick="changeQty('Set C', 1, event)">+</button></div></div>
    <div class="set" onclick="changeQty('Set D', 1)"><h3>Set D</h3><p>RM8</p><div class="quantity"><button onclick="changeQty('Set D', -1, event)">−</button><span id="qty-Set D">0</span><button onclick="changeQty('Set D', 1, event)">+</button></div></div>
    <div class="set" onclick="changeQty('Set E', 1)"><h3>Set E</h3><p>RM10</p><div class="quantity"><button onclick="changeQty('Set E', -1, event)">−</button><span id="qty-Set E">0</span><button onclick="changeQty('Set E', 1, event)">+</button></div></div>
    <div class="set" onclick="changeQty('Set F', 1)"><h3>Set F</h3><p>RM10</p><div class="quantity"><button onclick="changeQty('Set F', -1, event)">−</button><span id="qty-Set F">0</span><button onclick="changeQty('Set F', 1, event)">+</button></div></div>
    <div class="set" onclick="changeQty('Premium', 1)"><h3>Premium</h3><p>RM15</p><div class="quantity"><button onclick="changeQty('Premium', -1, event)">−</button><span id="qty-Premium">0</span><button onclick="changeQty('Premium', 1, event)">+</button></div></div>
  </div>

  <div class="drinks">
    <h2>Drinks</h2>
    <div class="drink-item"><span>Mineral Water (RM1)</span><button onclick="changeQty('Mineral Water', -1)">−</button><span id="qty-Mineral Water">0</span><button onclick="changeQty('Mineral Water', 1)">+</button></div>
    <div class="drink-item"><span>Thai Tea (RM4)</span><button onclick="changeQty('Thai Tea', -1)">−</button><span id="qty-Thai Tea">0</span><button onclick="changeQty('Thai Tea', 1)">+</button></div>
    <div class="drink-item"><span>Lime Juice (RM4)</span><button onclick="changeQty('Lime Juice', -1)">−</button><span id="qty-Lime Juice">0</span><button onclick="changeQty('Lime Juice', 1)">+</button></div>
  </div>

  <button class="btn-next" onclick="goToAddOns()">Next</button>

  <script>
    function changeQty(item, change, event) {
      if (event) event.stopPropagation();
      const key = `qty-${item}`;
      const span = document.getElementById(key);
      let qty = parseInt(span.innerText);
      qty = Math.max(0, qty + change);
      span.innerText = qty;
      saveToStorage(item, qty);
    }

    function saveToStorage(item, qty) {
      const data = JSON.parse(localStorage.getItem('oden-order') || '{}');
      data[item] = qty;
      localStorage.setItem('oden-order', JSON.stringify(data));
    }

    function goToAddOns() {
      window.location.href = 'addons.html';
    }
  </script>
</body>
</html>
