<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Oden - Starting From RM6</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background: #fff6e6;
      color: #333;
    }
    header {
      text-align: center;
      padding: 2rem 1rem;
      background: #ffe6cc;
    }
    header img {
      max-width: 200px;
    }
    h1 {
      margin-top: 1rem;
      font-size: 2.2rem;
    }
    .price {
      font-size: 1.5rem;
      color: #d32f2f;
      font-weight: bold;
    }
    .menu {
      padding: 2rem 1rem;
      text-align: center;
    }
    .menu h2 {
      margin-bottom: 1rem;
    }
    .items {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }
    .item {
      background: #fff;
      border-radius: 12px;
      padding: 1rem;
      width: 180px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .item label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }
    .counter {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }
    .counter button {
      background-color: #d32f2f;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.3rem 0.7rem;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .counter span {
      min-width: 20px;
      text-align: center;
      font-weight: bold;
    }
    .total {
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 1rem;
    }
    .about, .contact {
      padding: 2rem 1rem;
      text-align: center;
    }
    .order-btn {
      margin-top: 2rem;
      background: #d32f2f;
      color: white;
      padding: 1rem 2rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    footer {
      background: #d32f2f;
      color: white;
      text-align: center;
      padding: 1rem;
    }
    .insta-link {
      text-align: center;
      margin-top: 1rem;
    }
    .insta-link a {
      text-decoration: none;
      color: #d32f2f;
      font-weight: bold;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

<header>
  <img src="logo.jpg" alt="Oden Logo" />
  <h1>Delicious Oden Bowls</h1>
  <p class="price">Starting from RM6</p>
</header>

<section class="menu">
  <h2>Build Your Bowl</h2>
  <form id="orderForm">
    <div class="items" id="itemList">
      <!-- Items will be injected here by JavaScript -->
    </div>
    <p class="total">Total: RM <span id="totalPrice">0.00</span></p>
    <div style="text-align:center;">
      <button type="button" class="order-btn" onclick="submitOrder()">Order via WhatsApp</button>
    </div>
  </form>
</section>

<section class="about">
  <h2>About Us</h2>
  <p>Hot, hearty, and flavorful Oden made just for you! Fast, affordable, and filling—perfect for any time of day.</p>
</section>

<section class="contact" id="order">
  <h2>Contact Us</h2>
  <p>📞 011-1570 1783</p>
  <div class="insta-link">
    <a href="https://www.instagram.com/thai_oden/" target="_blank">THAI_ODEN</a>
  </div>
</section>

<footer>
  &copy; 2025 Oden. All rights reserved.
</footer>

<script>
  const items = [
    { name: "Instant Noodle", price: 1 },
    { name: "Fish Cake", price: 1 },
    { name: "Crab Stick", price: 1 },
    { name: "Fish Ball", price: 2 },
    { name: "Seafood Tofu", price: 2 },
    { name: "Cheese Tofu", price: 2 },
    { name: "Egg", price: 1 },
    { name: "White Radish", price: 1 },
    { name: "Enoki Mushroom", price: 1 },
    { name: "Fuchuk", price: 1 },
  ];

  const itemList = document.getElementById('itemList');
  const totalPriceEl = document.getElementById('totalPrice');
  const itemQuantities = {};

  items.forEach((item, index) => {
    itemQuantities[item.name] = 0;
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <label>${item.name}</label>
      <div class="counter">
        <button type="button" onclick="updateQuantity('${item.name}', -1)">-</button>
        <span id="qty-${index}">0</span>
        <button type="button" onclick="updateQuantity('${item.name}', 1)">+</button>
      </div>
    `;
    itemList.appendChild(div);
  });

  function updateQuantity(name, change) {
    const index = items.findIndex(i => i.name === name);
    itemQuantities[name] = Math.max(0, itemQuantities[name] + change);
    document.getElementById(`qty-${index}`).textContent = itemQuantities[name];
    calculateTotal();
  }

  function calculateTotal() {
    let total = 0;
    items.forEach(item => {
      total += itemQuantities[item.name] * item.price;
    });
    totalPriceEl.textContent = total.toFixed(2);
  }

  function submitOrder() {
    let message = 'Hi, I would like to order:\n';
    let total = 0;

    items.forEach(item => {
      const qty = itemQuantities[item.name];
      if (qty > 0) {
        message += `- ${item.name}: ${qty}\n`;
        total += qty * item.price;
      }
    });

    if (total === 0) {
      alert('Please select at least one item.');
      return;
    }

    message += `Total: RM ${total.toFixed(2)}`;
    const encodedMessage = encodeURIComponent(message);
    const phoneNumber = '601115701783';
    const url = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;
    window.open(url, '_blank');
  }
</script>

</body>
</html>
