<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Oden - Add Ons</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background: #fff6e6;
      color: #333;
    }
    header {
      text-align: center;
      padding: 2rem 1rem;
      background: #ffe6cc;
    }
    h1 {
      margin-top: 1rem;
      font-size: 2.2rem;
    }
    .price {
      font-size: 1.5rem;
      color: #d32f2f;
      font-weight: bold;
    }
    .menu {
      padding: 2rem 1rem;
      text-align: center;
    }
    .items {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }
    .item {
      background: #fff;
      border-radius: 12px;
      padding: 1rem;
      width: 200px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .item label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: bold;
    }
    .item small {
      display: block;
      font-size: 0.9rem;
      color: #666;
    }
    .order-btn, .next-btn {
      margin-top: 2rem;
      background: #d32f2f;
      color: white;
      padding: 1rem 2rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    .total {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      font-weight: bold;
    }
    .quantity-control {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }
    .quantity-control button {
      padding: 0.4rem 0.8rem;
      font-size: 1rem;
    }
    .quantity-control input {
      width: 40px;
      text-align: center;
      font-size: 1rem;
    }
    #topBtn {
      display: none;
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 99;
      font-size: 18px;
      background-color: #d32f2f;
      color: white;
      border: none;
      border-radius: 50%;
      padding: 12px 16px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    #selectedSetInfo {
      text-align: center;
      padding: 1rem;
      background: #fff3e0;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <div id="selectedSetInfo"></div>

  <!-- Add-on and drink selection sections go here -->

  <div class="menu">
    <div class="total" id="totalDisplay">Total: RM0</div>
    <button class="next-btn" onclick="goToNextPage()">Next</button>
  </div>

  <button onclick="scrollToTop()" id="topBtn" title="Back to Top">↑ Top</button>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const selectedSet = localStorage.getItem("selectedSet");
      const selectedSetPrice = localStorage.getItem("selectedSetPrice");
      if (selectedSet && selectedSetPrice) {
        document.getElementById("selectedSetInfo").innerText =
          `Selected Set: ${selectedSet} (RM${parseFloat(selectedSetPrice).toFixed(2)})`;
      }
    });

    function goToNextPage() {
      alert('Proceeding to next step.');
    }

    window.onscroll = function() {
      document.getElementById("topBtn").style.display =
        document.body.scrollTop > 200 || document.documentElement.scrollTop > 200
        ? "block" : "none";
    };

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
